<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <title>{{ page.title }} - {{ site.title }}</title>
        <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
        
        {% if page.style %}
        <link rel="stylesheet" href="{{ '/assets/css/' | append: page.style | relative_url }}">
        {% endif %}

        <script src="{{ '/assets/js/global.js' | relative_url }}" defer></script>

        {% if page.script %}
        <script src="{{ '/assets/js/' | append: page.script | relative_url }}" defer></script>
        {% endif %}
    </head>
    <body>
        <main>
            <section id="content-container">
                {{ content }}
            </section>
        </main>
    </body>
</html>
